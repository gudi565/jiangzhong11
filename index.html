<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>降重 · jiangzhong</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<header class="hero">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="m8.5 13 2 2 3.5-3.5"/>
      </svg>
    </span>
    <h1>降重</h1>
  </div>
  <p class="sub">中文学术改写 · 保引用 · 保数据 · 保留原意</p>
  <div class="features">
    <span class="pill">保引用文献</span>
    <span class="pill">保数据 / 公式</span>
    <span class="pill">分学科策略</span>
  </div>
</header>

<main class="card">
  <div class="quota-bar">
    <span class="quota-chip">加载中…</span>
    <span class="quota-redeem">
      <input id="redeem-code" type="text" placeholder="输入兑换码" autocomplete="off" />
      <button id="redeem-btn" type="button" class="ghost mini">兑换</button>
      <button id="buy-btn" type="button" class="primary mini">购买时长</button>
    </span>
  </div>
  <div id="buy-panel" class="buy-panel" hidden>
    <button class="plan-btn" data-plan="1h" type="button"><span class="plan-name">1 小时</span><span class="plan-price">¥9.9</span></button>
    <button class="plan-btn" data-plan="1d" type="button"><span class="plan-name">1 天</span><span class="plan-price">¥29.9</span></button>
    <button class="plan-btn" data-plan="7d" type="button"><span class="plan-name">7 天</span><span class="plan-price">¥69.9</span></button>
    <div id="buy-status" class="buy-status"></div>
  </div>

  <nav class="tabs" aria-label="功能切换">
    <button class="tab active" data-task="rewrite" type="button">降重</button>
    <button class="tab" data-task="humanize" type="button">降 AIGC</button>
    <button class="tab" data-task="english" type="button">英文修改</button>
    <button class="tab" data-task="aigc" type="button">查 AIGC</button>
    <button class="tab" data-task="plagiarism" type="button">查重</button>
  </nav>

  <textarea id="input" placeholder="把需要降重的段落粘贴在这里（最多 20000 字）…"></textarea>

  <label class="pipe-toggle">
    <input type="checkbox" id="pipe" checked />
    <span>质量管线：分类 → 针对性重写 → 校验 → 重试 → 修复</span>
  </label>

  <div class="controls">
    <div class="selectors">
      <div class="segmented" id="strength">
        <button data-v="light" type="button">轻度</button>
        <button data-v="medium" type="button" class="active">中度</button>
        <button data-v="deep" type="button">深度</button>
      </div>
      <label class="field">
        <span>学科</span>
        <select id="discipline">
          <option value="auto">自动</option>
          <option value="stem">理工</option>
          <option value="humanities">人文社科</option>
          <option value="medicine">医学</option>
          <option value="law">法学</option>
        </select>
      </label>
      <div class="segmented" id="english-mode" style="display:none">
        <button data-sub="polish" type="button" class="active">润色</button>
        <button data-sub="dedup" type="button">降重</button>
        <button data-sub="translate" type="button">中翻英</button>
      </div>
    </div>
    <div class="actions">
      <input type="file" id="file" accept=".docx" hidden />
      <button id="sample" type="button" class="ghost">试试样例</button>
      <button id="upload" type="button" class="ghost">上传 Word</button>
      <button id="go" type="button" class="primary">改写</button>
    </div>
  </div>

  <div id="err" class="err" hidden></div>

  <section id="result" hidden>
    <div class="metrics">
      <div class="metric"><span class="num" id="m-cov">—</span><span class="lab">改写差异度<br><small>文字层面 · 估算</small></span></div>
      <div class="metric"><span class="num" id="m-sim">—</span><span class="lab">与原文相似度<br><small>文字层面 · 估算</small></span></div>
      <div class="metric"><span class="num" id="m-len">—</span><span class="lab">字数<br><small>原 → 改</small></span></div>
    </div>
    <div id="diag" class="diag" hidden></div>
    <div class="cols">
      <div class="col">
        <h3>原文</h3>
        <div id="orig" class="text"></div>
      </div>
      <div class="col">
        <h3>降重后 <button id="copy" type="button" class="ghost mini">复制</button><button id="download" type="button" class="ghost mini">下载 Word</button></h3>
        <div id="out" class="text"></div>
      </div>
    </div>
    <p class="note">「改写差异度」是按字符二元组估算的<b>文字改写幅度</b>，<b>不等于</b>知网/万方等系统的实际查重率，两者相关但不相等。权威查重率请以 <a href="https://cx.cnki.net" target="_blank" rel="noopener">知网 cx.cnki.net</a> 等官方结果为准。</p>
  </section>

  <section id="check-result" hidden>
    <div class="aigc-report">
      <div class="gauge">
        <div class="gauge-num" id="aigc-score">—</div>
        <div class="gauge-cap">AIGC 概率（参考估算）</div>
        <div class="gauge-track"><span id="aigc-bar"></span></div>
      </div>
      <div class="aigc-verdict" id="aigc-verdict">—</div>
      <div class="signals" id="aigc-signals"></div>
      <p class="note" id="aigc-note"></p>
    </div>
    <div class="plag-report" hidden>
      <div class="plag-summary">
        <div class="plag-score" id="plag-score">—</div>
        <div class="plag-cap">与网络雷同的句子占比（参考）</div>
        <div class="plag-bar-track"><span id="plag-bar"></span></div>
        <div class="plag-verdict" id="plag-verdict">—</div>
      </div>
      <div class="plag-meta" id="plag-meta"></div>
      <div class="matches" id="plag-matches"></div>
      <p class="note" id="plag-note"></p>
    </div>
  </section>
</main>

<footer class="foot">降重 · <span id="mode-label">质量管线</span> · 文字改写参考工具</footer>

<script src="/assets/app.js"></script>
</body>
</html>
