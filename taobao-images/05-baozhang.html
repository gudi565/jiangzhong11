<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>降重君 · 为什么选我们</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 800px; height: 800px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    background:
      radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.10) 0%, transparent 45%),
      linear-gradient(180deg, #f8fafc 0%, #eef2f9 100%);
    color: #0f172a;
  }
  /* 顶部 */
  .header {
    text-align: center;
    padding-top: 50px;
  }
  .h-tag {
    display: inline-block;
    padding: 8px 20px;
    background: #dbeafe;
    color: #1a56db;
    font-size: 22px; font-weight: 700;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  .h-title {
    font-size: 62px; font-weight: 900; color: #0a1f5c;
    letter-spacing: 3px;
  }
  .h-title .accent {
    background: linear-gradient(180deg, #1a56db, #2563eb);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 卖点 2x2 */
  .grid {
    margin: 46px 50px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  .card {
    position: relative;
    background: #fff;
    border-radius: 22px;
    padding: 26px 24px;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    border: 2px solid #e2e8f0;
    min-height: 188px;
  }
  .ico-box {
    width: 70px; height: 70px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: 14px;
  }
  .c1 .ico-box { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
  .c2 .ico-box { background: linear-gradient(135deg, #fef3c7, #fde68a); }
  .c3 .ico-box { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); }
  .c4 .ico-box { background: linear-gradient(135deg, #dcfce7, #bbf7d0); }

  .card-title {
    font-size: 30px; font-weight: 800; color: #0a1f5c;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 18px; line-height: 1.55;
    color: #64748b; font-weight: 500;
  }
  .card-desc .b { color: #1a56db; font-weight: 700; }

  /* 底部条 */
  .footer-bar {
    position: absolute;
    left: 50px; right: 50px; bottom: 36px;
    padding: 22px 26px;
    background: linear-gradient(135deg, #1a56db, #2563eb);
    border-radius: 18px;
    color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 12px 28px rgba(26, 86, 219, 0.32);
  }
  .fb-left { display: flex; flex-direction: column; }
  .fb-big { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
  .fb-small { font-size: 16px; opacity: 0.9; margin-top: 2px; }
  .fb-stamp {
    padding: 10px 18px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 14px;
    font-size: 20px; font-weight: 700;
  }
  .fb-stamp .dot { color: #fde68a; }
</style>
</head>
<body>
  <div class="header">
    <div class="h-tag">用户至上 · 用心服务</div>
    <div class="h-title">为什么选<span class="accent">降重君</span></div>
  </div>

  <div class="grid">
    <div class="card c1">
      <div class="ico-box">🔒</div>
      <div class="card-title">隐私安全</div>
      <div class="card-desc">文档<span class="b">不入库不存档</span>,本地处理,保护论文隐私</div>
    </div>

    <div class="card c2">
      <div class="ico-box">⚡</div>
      <div class="card-title">全天可用</div>
      <div class="card-desc"><span class="b">7×24 小时</span>稳定服务,自动发货,卡密秒发</div>
    </div>

    <div class="card c3">
      <div class="ico-box">🤖</div>
      <div class="card-title">大模型驱动</div>
      <div class="card-desc">基于 <span class="b">GLM 大模型</span>,比传统同义词软件更通顺自然</div>
    </div>

    <div class="card c4">
      <div class="ico-box">💬</div>
      <div class="card-title">售后答疑</div>
      <div class="card-desc">使用问题<span class="b">旺旺沟通</span>,贴心指导到会用为止</div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="fb-left">
      <div class="fb-big">自动发货 · 卡密即发</div>
      <div class="fb-small">拍下立刻收到 · 网页粘贴兑换 · 立即可用</div>
    </div>
    <div class="fb-stamp">秒发<span class="dot">·</span>即用</div>
  </div>
</body>
</html>
